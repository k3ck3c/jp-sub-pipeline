[project]
name = "jpsub"
version = "0.2.0"
description = "Atelier d'étude du japonais par les chansons : transcription, furigana, traduction et cartes Anki"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2",
    # PyAV 19 a retiré un paramètre utilisé par faster-whisper 1.2.x (decode_audio)
    "av>=11,<19",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "pyyaml>=6",
    # deno : moteur JavaScript dont yt-dlp a besoin pour YouTube
    "yt-dlp[default,deno]",
    "requests>=2.32",
    "pysubs2>=1.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "genanki>=0.13",
]

[project.optional-dependencies]
# Transcription par l'API OpenAI (asr.backend: api)
api = ["openai>=1.40"]

[tool.uv]
# Application, pas une bibliothèque : on lance `uv run python -m jpsub`
package = false
