
asr:
  model: small
  device: auto
  beam_size: 5
  vad_filter: false
  language: ja

# Détection de langue : les métadonnées YouTube ne servent que d'indice,
# Whisper écoute 3 extraits de 30 s (à 30 %, 50 %, 70 % du morceau).
language_check:
  enabled: true
  accept: 0.5        # probabilité « ja » >= 0.5 : japonais confirmé
  reject: 0.2        # < 0.2 : rejeté (bouton « Forcer le japonais » dans l'appli, ou --force-ja)
  meta_reject_score: -3

black_video:
  enabled: false     # la vidéo noire n'est plus utile avec le lecteur web

subtitles:
  max_line_len: 22
  min_duration: 0.8

study:
  enabled: true

paths:
  output_dir: ./output
  db: ./data/jpsub.sqlite3

volumes:
  - ./config.yaml:/app/config.yaml:ro