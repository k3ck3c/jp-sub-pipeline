x-jpsub: &jpsub
  build:
    context: .
    dockerfile: Dockerfile.local
  image: jpsub:local
  user: "${UID}:${GID}"
  environment:
    # Modèles Whisper gardés dans ./data pour ne pas les retélécharger à chaque lancement
    HF_HOME: /app/data/models
    XDG_CACHE_HOME: /app/data/cache
    DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    HF_TOKEN: ${HF_TOKEN:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ASR_BACKEND: ${ASR_BACKEND:-local}
    ANKI_CONNECT_ENABLED: ${ANKI_CONNECT_ENABLED:-1}
    ANKI_CONNECT_HOST: host.docker.internal
    ANKI_CONNECT_PORT: "8765"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./output:/app/output
    - ./input:/app/input
    - ./data:/app/data
    - ./cookies:/cookies:ro
    - ./artists_map.yaml:/app/artists_map.yaml:ro
    - ./song_aliases.json:/app/song_aliases.json:ro
    - ./config.yaml:/app/config.yaml:ro
    - ./batch.txt:/app/batch.txt

services:
  # Appli web : http://localhost:8000 (API + worker + SQLite dans un seul conteneur)
  jpsub-web:
    <<: *jpsub
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${JPSUB_PORT:-8000}:8000"
    restart: unless-stopped

  # Ligne de commande, comme avant : docker compose run --rm jpsub-local --input URL
  jpsub-local:
    <<: *jpsub
